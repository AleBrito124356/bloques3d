[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bloques3d"
version = "1.0.0"
description = "Piezas tipo LEGO paramétricas (medidas reales en mm), escenas JSON validadas y render/exportación con Blender sin interfaz."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = ["blender", "lego", "bmesh", "procedural", "stl", "gltf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Natural Language :: Spanish",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bloques3d = "bloques3d.cli:main"

[tool.setuptools.packages.find]
include = ["bloques3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "blender: pruebas de integracion que lanzan Blender --background --factory-startup (se saltan si no hay Blender)",
]
